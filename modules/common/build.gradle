plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = rootProject.neoform_version
}

dependencies {
    // Mixin compile-only (processing happens in loader modules)
    compileOnly "org.spongepowered:mixin:0.8.7"

    // Accessories API (common, mojmap variant)
    compileOnly "io.wispforest:accessories-common:${rootProject.accessories_version}-mojmap"

    // Beltborne Lanterns (common module from Maven)
    compileOnly "net.oxcodsnet.beltborne_lanterns.common:beltborne_lanterns-common-mc${rootProject.minecraft_version}:${rootProject.beltborne_lanterns_version}"
}
