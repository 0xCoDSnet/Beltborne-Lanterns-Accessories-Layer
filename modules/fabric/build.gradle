plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    //modImplementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    // Accessories (WispForest) API — compile against official API, optional at runtime
    modImplementation "io.wispforest:accessories-fabric:${rootProject.accessories_version}"

    // OWO lib (Accessories expects it), optional at runtime
    modImplementation "io.wispforest:owo-lib:${rootProject.owo_version}"

    //Сloth Сonfig
    modImplementation "me.shedaniel.cloth:cloth-config-fabric:${rootProject.cloth_config_version}"

    // Beltborne Lanterns: use dev-shadow (named) jar for compile (force classifier), and regular jar for runtime in dev
    // Force resolve the dev-shadow artifact via classifier syntax to bypass Gradle module metadata variant selection
    modImplementation "net.oxcodsnet.beltborne_lanterns.fabric:beltborne_lanterns-fabric-mc${rootProject.minecraft_version}:${rootProject.beltborne_lanterns_version}"

    common(project(path: ':modules:common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':modules:common', configuration: 'transformProductionFabric')
}

processResources {
    def props = [
            version               : project.version,
            mod_id                : rootProject.findProperty('mod_id'),
            mod_name              : rootProject.findProperty('mod_name'),
            mod_description       : rootProject.findProperty('mod_description'),
            mod_authors           : rootProject.findProperty('mod_authors'),
            mod_homepage          : rootProject.findProperty('mod_homepage'),
            mod_sources           : rootProject.findProperty('mod_sources'),
            mod_license           : rootProject.findProperty('mod_license'),
            minecraft_version     : rootProject.findProperty('minecraft_version'),
            fabric_loader_version : rootProject.findProperty('fabric_loader_version'),
            beltborne_lanterns_version  : rootProject.findProperty('beltborne_lanterns_version'),
            modmenu_version       : rootProject.findProperty('modmenu_version'),
    ]
    inputs.properties(props)

    filesMatching('fabric.mod.json') {
        expand(props)
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
    archiveFileName.set("${rootProject.findProperty('mod_id')}-${project.version}-fabric+${rootProject.minecraft_version}.jar")
}

// =========== Modrith =========
apply plugin: "com.modrinth.minotaur"
def modrinth_token = rootProject.ext.resolveModrinthToken()
boolean hasModrinthToken = modrinth_token != null && !modrinth_token.toString().trim().isEmpty()
if (!hasModrinthToken) {
    logger.warn("MODRINTH_TOKEN is not configured; using a dummy value and disabling Modrinth publishing tasks.")
    modrinth_token = "modrinth_dummy_token"
}
modrinth {
    token = modrinth_token
    projectId = "geZ7ilkE"
    versionNumber = "${project.version}-fabric"
    versionName   = "${rootProject.findProperty('mod_name_web')} v${project.version}+${rootProject.minecraft_version} [Fabric/Quilt]"
    versionType   = "beta"                 // или "beta"/"alpha"
    gameVersions  = [ rootProject.minecraft_version ]
    loaders       = [ "fabric","quilt" ]
    uploadFile    = remapJar                   // из Loom
    changelog     = rootProject.file("CHANGELOG.md").exists() ? rootProject.file("CHANGELOG.md").text : ""
    dependencies { required.project "beltborne-lanterns" }
}

// ====================== CurseForge ====================
apply plugin: "net.darkhax.curseforgegradle"

def curse_token = rootProject.ext.resolveCurseforgeToken()
boolean hasCurseToken = curse_token != null && !curse_token.toString().trim().isEmpty()
if (!hasCurseToken) {
    logger.warn("CURSEFORGE_TOKEN is not configured; using a dummy value and disabling CurseForge publishing tasks.")
    curse_token = "curseforge_dummy_token"
}

def curse_project_id =
        (findProperty("curseforge_project_fabric")
                ?: System.getenv("CURSEFORGE_PROJECT_FABRIC")
                ?: findProperty("curseforge_project")
                ?: System.getenv("CURSEFORGE_PROJECT_ID")
                ?: "1342341")

tasks.register("curseforge", net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    apiToken = curse_token

    disableVersionDetection()

    dependsOn remapJar
    def mainFile = upload(curse_project_id as String, remapJar)

    mainFile.displayName = "${rootProject.findProperty('mod_name_web')} v${project.version}+${rootProject.minecraft_version} [Fabric/Quilt]"
    mainFile.releaseType = "beta"
    mainFile.addModLoader("Fabric")
    mainFile.addModLoader("Quilt")
    mainFile.addGameVersion("${rootProject.minecraft_version}")
    mainFile.addJavaVersion("Java 21")
    mainFile.addEnvironment("Client", "Server")
    mainFile.changelog = rootProject.file("CHANGELOG.md"); mainFile.changelogType = "markdown"
    mainFile.addRequirement("beltborne-lanterns")
}
