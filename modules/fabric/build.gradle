plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
    id 'com.modrinth.minotaur'
    id 'net.darkhax.curseforgegradle'
}

base {
    archivesName = "${rootProject.archives_name}-fabric"
}

repositories {
    maven { url = 'https://maven.shedaniel.me/' }
    maven { url = 'https://maven.terraformersmc.com/' }
    maven { url = 'https://maven.wispforest.io' }
    maven { url = 'https://packex.shadscure.com/releases' }
}

loom {
    mixin {
        defaultRefmapName = "bl_accessories_layer-fabric.refmap.json"
    }

    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run/client")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run/server")
        }
    }
}

tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

dependencies {
    minecraft "net.minecraft:minecraft:${rootProject.minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"

    // Accessories (WispForest)
    modImplementation "io.wispforest:accessories-fabric:${rootProject.accessories_version}"

    // OWO lib (Accessories dependency)
    modImplementation "io.wispforest:owo-lib:${rootProject.owo_version}"

    // Cloth Config
    modImplementation "me.shedaniel.cloth:cloth-config-fabric:${rootProject.cloth_config_version}"

    // Beltborne Lanterns (compile-only: BL is a separate runtime dependency)
    // Common classes (Mojmap from NeoForm)
    compileOnly "net.oxcodsnet.beltborne_lanterns.common:beltborne_lanterns-common-mc${rootProject.minecraft_version}:${rootProject.beltborne_lanterns_version}"
    // Fabric-specific classes (dev jar, Mojmap)
    compileOnly("net.oxcodsnet.beltborne_lanterns.fabric:beltborne_lanterns-fabric-mc${rootProject.minecraft_version}:${rootProject.beltborne_lanterns_version}") {
        artifact { classifier = 'dev' }
    }
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    def props = [
        version               : project.version,
        mod_id                : rootProject.findProperty('mod_id'),
        mod_name              : rootProject.findProperty('mod_name'),
        mod_description       : rootProject.findProperty('mod_description'),
        mod_authors           : rootProject.findProperty('mod_authors'),
        mod_homepage          : rootProject.findProperty('mod_homepage'),
        mod_sources           : rootProject.findProperty('mod_sources'),
        mod_license           : rootProject.findProperty('mod_license'),
        minecraft_version     : rootProject.findProperty('minecraft_version'),
        fabric_loader_version : rootProject.findProperty('fabric_loader_version'),
        beltborne_lanterns_version : rootProject.findProperty('beltborne_lanterns_version'),
        modmenu_version       : rootProject.findProperty('modmenu_version'),
    ]
    inputs.properties(props)
    filesMatching('fabric.mod.json') { expand(props) }
}

remapJar {
    archiveFileName.set("${rootProject.findProperty('mod_id')}-${project.version}-fabric+${rootProject.minecraft_version}.jar")
}

// =========== Modrinth =========
def modrinth_token = rootProject.ext.resolveModrinthToken()
if (!modrinth_token) {
    logger.warn("WARNING: MODRINTH_TOKEN not found. Publishing to Modrinth will be skipped.")
    modrinth_token = "dummy_token_publishing_disabled"
}

modrinth {
    token = modrinth_token
    projectId = "geZ7ilkE"
    versionNumber = "${project.version}-fabric"
    versionName   = "${rootProject.findProperty('mod_name_web')} v${project.version}+${rootProject.minecraft_version} [Fabric/Quilt]"
    versionType   = "beta"
    gameVersions  = [ rootProject.minecraft_version ]
    loaders       = [ "fabric", "quilt" ]
    uploadFile    = remapJar
    changelog     = rootProject.file("CHANGELOG.md").exists() ? rootProject.file("CHANGELOG.md").text : ""
    dependencies { required.project "beltborne-lanterns" }
}

// ====================== CurseForge ====================
def curse_token = rootProject.ext.resolveCurseforgeToken()
if (!curse_token) {
    logger.warn("WARNING: CURSEFORGE_TOKEN not found. Publishing to CurseForge will be skipped.")
    curse_token = "dummy_token_publishing_disabled"
}

def curse_project_id =
        (findProperty("curseforge_project_fabric")
                ?: System.getenv("CURSEFORGE_PROJECT_FABRIC")
                ?: findProperty("curseforge_project")
                ?: System.getenv("CURSEFORGE_PROJECT_ID")
                ?: "1342341")

tasks.register("curseforge", net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    apiToken = curse_token

    disableVersionDetection()

    dependsOn remapJar
    def mainFile = upload(curse_project_id as String, remapJar)

    mainFile.displayName = "${rootProject.findProperty('mod_name_web')} v${project.version}+${rootProject.minecraft_version} [Fabric/Quilt]"
    mainFile.releaseType = "beta"
    mainFile.addModLoader("Fabric")
    mainFile.addModLoader("Quilt")
    mainFile.addGameVersion("${rootProject.minecraft_version}")
    mainFile.addJavaVersion("Java 21")
    mainFile.addEnvironment("Client", "Server")
    mainFile.changelog = rootProject.file("CHANGELOG.md"); mainFile.changelogType = "markdown"
    mainFile.addRequirement("beltborne-lanterns")
}
