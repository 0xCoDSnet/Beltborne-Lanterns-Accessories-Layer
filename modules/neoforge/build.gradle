plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    //modImplementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"


    // Accessories (WispForest) API — optional; compileOnly so dev run doesn't pull 1.21.1 deps
    modCompileOnly "io.wispforest:accessories-neoforge:${rootProject.accessories_version}"
    //modRuntimeOnly  "io.wispforest:accessories-neoforge:${rootProject.accessories_version}"

    // Provide Fabric Event interface at compile-time only (Accessories API types reference it)
    compileOnly "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"

    // OWO lib (Accessories expects it) — compileOnly, do not include at runtime in dev
    modCompileOnly "io.wispforest:owo-lib-neoforge:${rootProject.owo_neoforge_version}"
    //modRuntimeOnly  "io.wispforest:owo-lib:${rootProject.owo_version}"

    modImplementation "me.shedaniel.cloth:cloth-config-neoforge:${rootProject.cloth_config_version}"

    // Beltborne Lanterns: use dev-shadow (named) jar for compile, and regular jar for runtime in dev
    compileOnly    "net.oxcodsnet.beltborne_lanterns.neoforge:beltborne_lanterns-neoforge-mc${rootProject.minecraft_version}:${rootProject.beltborne_lanterns_version}:dev"
    modRuntimeOnly "net.oxcodsnet.beltborne_lanterns.neoforge:beltborne_lanterns-neoforge-mc${rootProject.minecraft_version}:${rootProject.beltborne_lanterns_version}"

    common(project(path: ':modules:common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':modules:common', configuration: 'transformProductionNeoForge')
}

processResources {
    def props = [
            version              : project.version,
            mod_name             : rootProject.findProperty('mod_name'),
            mod_id               : rootProject.findProperty('mod_id'),
            mod_description      : rootProject.findProperty('mod_description'),
            mod_authors          : rootProject.findProperty('mod_authors'),
            mod_homepage         : rootProject.findProperty('mod_homepage'),
            mod_sources          : rootProject.findProperty('mod_sources'),
            mod_license          : rootProject.findProperty('mod_license'),
            minecraft_version    : rootProject.findProperty('minecraft_version'),
            neoforge_version     : rootProject.findProperty('neoforge_version'),
            beltborne_lanterns_version : rootProject.findProperty('beltborne_lanterns_version'),
    ]
    inputs.properties(props)

    filesMatching('META-INF/neoforge.mods.toml') {
        expand(props)
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
    archiveFileName.set("${rootProject.findProperty('mod_id')}-${project.version}-neoforge+${rootProject.minecraft_version}.jar")
}

// =========== Modrith =========
apply plugin: "com.modrinth.minotaur"
def modrinth_token = rootProject.ext.resolveModrinthToken()
if (!modrinth_token) throw new GradleException("Set MODRINTH_TOKEN env or in .env")

modrinth {
    token = modrinth_token
    projectId = "geZ7ilkE"
    versionNumber = "${project.version}-neoforge"
    versionName   = "${rootProject.findProperty('mod_name_web')} v${project.version}+${rootProject.minecraft_version} [NeoForge]"
    versionType   = "beta"                 // или "beta"/"alpha"
    gameVersions  = [ rootProject.minecraft_version ]
    loaders       = [ "neoforge" ]
    uploadFile    = remapJar                   // из Loom
    changelog     = rootProject.file("CHANGELOG.md").exists() ? rootProject.file("CHANGELOG.md").text : ""
    dependencies { required.project "beltborne-lanterns" }
}

// ====================== CurseForge ====================
apply plugin: "net.darkhax.curseforgegradle"

def curse_token = rootProject.ext.resolveCurseforgeToken()
if (!curse_token) throw new GradleException("Set CURSEFORGE_TOKEN env or in .env/gradle.properties")


def curse_project_id =
        (findProperty("curseforge_project_fabric")
                ?: System.getenv("CURSEFORGE_PROJECT_FABRIC")
                ?: findProperty("curseforge_project")
                ?: System.getenv("CURSEFORGE_PROJECT_ID")
                ?: "1342341")

tasks.register("curseforge", net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    apiToken = curse_token

    disableVersionDetection()

    dependsOn remapJar
    def mainFile = upload(curse_project_id as String, remapJar)

    mainFile.displayName = "${rootProject.findProperty('mod_name_web')} v${project.version}+${rootProject.minecraft_version} [NeoForge]"
    mainFile.releaseType = "beta"
    mainFile.addModLoader("NeoForge")
    mainFile.addGameVersion("${rootProject.minecraft_version}")
    mainFile.addJavaVersion("Java 21")
    mainFile.addEnvironment("Client", "Server")
    mainFile.changelog = rootProject.file("CHANGELOG.md"); mainFile.changelogType = "markdown"
    mainFile.addRequirement("beltborne-lanterns")
}
