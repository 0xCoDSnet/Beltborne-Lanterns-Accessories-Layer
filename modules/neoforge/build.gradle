plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
    id 'com.modrinth.minotaur'
    id 'net.darkhax.curseforgegradle'
}

base {
    archivesName = "${rootProject.archives_name}-neoforge"
}

def modId = rootProject.findProperty('mod_id')

repositories {
    maven { url = 'https://maven.shedaniel.me/' }
    maven { url = 'https://maven.neoforged.net/releases/' }
    maven { url = 'https://maven.wispforest.io' }
    maven { url = 'https://maven.su5ed.dev/releases' }
    maven { url = 'https://packex.shadscure.com/releases' }
}

neoForge {
    version = rootProject.neoforge_version

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        "${modId}" {
            sourceSet(sourceSets.main)
        }
    }
}

tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

dependencies {
    // Accessories (WispForest)
    implementation "io.wispforest:accessories-neoforge:${rootProject.accessories_version}"

    // OWO lib (Accessories dependency)
    implementation "io.wispforest:owo-lib-neoforge:${rootProject.owo_neoforge_version}"

    // Cloth Config
    implementation "me.shedaniel.cloth:cloth-config-neoforge:${rootProject.cloth_config_version}"

    // Beltborne Lanterns
    implementation "net.oxcodsnet.beltborne_lanterns.neoforge:beltborne_lanterns-neoforge-mc${rootProject.minecraft_version}:${rootProject.beltborne_lanterns_version}"
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    def props = [
        version              : project.version,
        mod_name             : rootProject.findProperty('mod_name'),
        mod_id               : rootProject.findProperty('mod_id'),
        mod_description      : rootProject.findProperty('mod_description'),
        mod_authors          : rootProject.findProperty('mod_authors'),
        mod_homepage         : rootProject.findProperty('mod_homepage'),
        mod_sources          : rootProject.findProperty('mod_sources'),
        mod_license          : rootProject.findProperty('mod_license'),
        minecraft_version    : rootProject.findProperty('minecraft_version'),
        neoforge_version     : rootProject.findProperty('neoforge_version'),
        beltborne_lanterns_version : rootProject.findProperty('beltborne_lanterns_version'),
    ]
    inputs.properties(props)
    filesMatching('META-INF/neoforge.mods.toml') { expand(props) }
}

jar {
    archiveFileName.set("${rootProject.findProperty('mod_id')}-${project.version}-neoforge+${rootProject.minecraft_version}.jar")
}

// =========== Modrinth =========
def modrinth_token = rootProject.ext.resolveModrinthToken()
if (!modrinth_token) {
    logger.warn("WARNING: MODRINTH_TOKEN not found. Publishing to Modrinth will be skipped.")
    modrinth_token = "dummy_token_publishing_disabled"
}

modrinth {
    token = modrinth_token
    projectId = "geZ7ilkE"
    versionNumber = "${project.version}-neoforge"
    versionName   = "${rootProject.findProperty('mod_name_web')} v${project.version}+${rootProject.minecraft_version} [NeoForge]"
    versionType   = "beta"
    gameVersions  = [ rootProject.minecraft_version ]
    loaders       = [ "neoforge" ]
    uploadFile    = jar
    changelog     = rootProject.file("CHANGELOG.md").exists() ? rootProject.file("CHANGELOG.md").text : ""
    dependencies { required.project "beltborne-lanterns" }
}

// ====================== CurseForge ====================
def curse_token = rootProject.ext.resolveCurseforgeToken()
if (!curse_token) {
    logger.warn("WARNING: CURSEFORGE_TOKEN not found. Publishing to CurseForge will be skipped.")
    curse_token = "dummy_token_publishing_disabled"
}

def curse_project_id =
        (findProperty("curseforge_project_neoforge")
                ?: System.getenv("CURSEFORGE_PROJECT_NEOFORGE")
                ?: findProperty("curseforge_project")
                ?: System.getenv("CURSEFORGE_PROJECT_ID")
                ?: "1342341")

tasks.register("curseforge", net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    apiToken = curse_token

    disableVersionDetection()

    dependsOn jar
    def mainFile = upload(curse_project_id as String, jar)

    mainFile.displayName = "${rootProject.findProperty('mod_name_web')} v${project.version}+${rootProject.minecraft_version} [NeoForge]"
    mainFile.releaseType = "beta"
    mainFile.addModLoader("NeoForge")
    mainFile.addGameVersion("${rootProject.minecraft_version}")
    mainFile.addJavaVersion("Java 21")
    mainFile.addEnvironment("Client", "Server")
    mainFile.changelog = rootProject.file("CHANGELOG.md"); mainFile.changelogType = "markdown"
    mainFile.addRequirement("beltborne-lanterns")
}
