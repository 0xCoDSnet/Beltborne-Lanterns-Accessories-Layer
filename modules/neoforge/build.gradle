plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    //modImplementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"


    // Accessories (WispForest) API — optional; compileOnly so dev run doesn't pull 1.21.1 deps
    modCompileOnly "io.wispforest:accessories-neoforge:${rootProject.accessories_version}"
    //modRuntimeOnly  "io.wispforest:accessories-neoforge:${rootProject.accessories_version}"

    // Provide Fabric Event interface at compile-time only (Accessories API types reference it)
    compileOnly "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"

    // OWO lib (Accessories expects it) — compileOnly, do not include at runtime in dev
    modCompileOnly "io.wispforest:owo-lib-neoforge:${rootProject.owo_neoforge_version}"
    //modRuntimeOnly  "io.wispforest:owo-lib:${rootProject.owo_version}"

    modCompileOnly "net.oxcodsnet.beltborne_lanterns:beltborne_lanterns-neoforge:${rootProject.beltborne_lanterns_version}"

    common(project(path: ':modules:common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':modules:common', configuration: 'transformProductionNeoForge')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
